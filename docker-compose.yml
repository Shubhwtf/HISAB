version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hisab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hisab_user
      POSTGRES_PASSWORD: hisab_password
      POSTGRES_DB: hisab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hisab_user -d hisab"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hisab_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: hisab_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://hisab_user:hisab_password@postgres:5432/hisab
      - SYNC_DATABASE_URL=postgresql+psycopg://hisab_user:hisab_password@postgres:5432/hisab
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: hisab_worker
    restart: unless-stopped
    command: ["python", "-m", "packages.worker.runner"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://hisab_user:hisab_password@postgres:5432/hisab
      - SYNC_DATABASE_URL=postgresql+psycopg://hisab_user:hisab_password@postgres:5432/hisab
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    name: hisab_postgres_data
  redis_data:
    name: hisab_redis_data
