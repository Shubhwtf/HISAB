version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hisab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hisab_user
      POSTGRES_PASSWORD: hisab_password
      POSTGRES_DB: hisab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hisab_user -d hisab"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hisab_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: hisab_postgres_data
  redis_data:
    name: hisab_redis_data
